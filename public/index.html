<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdooXGJVidhyaPith - Auth</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <div class="auth-card">
            <div class="card-header">
                <div class="logo-circle">
                    <img src="https://via.placeholder.com/100/3498db/ffffff?text=U" alt="Logo" id="auth-logo">
                </div>
                <div class="role-badge">Admin</div>
            </div>

            <div class="form-container">
                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Please enter your details to sign in</p>
                    
                    <div class="input-group">
                        <input type="email" id="login-email" required placeholder=" ">
                        <label for="login-email">Email Address</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="login-password" required placeholder=" ">
                        <label for="login-password">Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                    
                    <p class="toggle-text">Don't have an account? <span id="to-register">Register</span></p>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form">
                    <h2>Create Account</h2>
                    <p class="subtitle">Join us and start your journey</p>

                    <div class="input-group">
                        <input type="text" id="reg-name" required placeholder=" ">
                        <label for="reg-name">Full Name</label>
                    </div>
                    
                    <div class="input-group">
                        <input type="email" id="reg-email" required placeholder=" ">
                        <label for="reg-email">Email Address</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="reg-password" required placeholder=" ">
                        <label for="reg-password">Password</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="reg-confirm-password" required placeholder=" ">
                        <label for="reg-confirm-password">Confirm Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Register</button>
                    
                    <p class="toggle-text">Already have an account? <span id="to-login">Login</span></p>
                </form>
            </div>
            
            <div id="message-container" class="message-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
